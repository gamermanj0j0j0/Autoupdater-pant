name: PantKontroll access policy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Access-policy operation
        required: true
        type: choice
        options:
          - revoke
          - restore
          - deny_all
          - allow_all
      kind:
        description: Identifier type (used by revoke/restore)
        required: true
        default: device
        type: choice
        options:
          - device
          - anchor
      identifier:
        description: Derived dev1_… or anc1_… token (blank for deny_all/allow_all)
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: pant-access-policy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-policy
    steps:
      - name: Check out default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=45,<47"

      - name: Validate and update policy
        env:
          POLICY_ACTION: ${{ inputs.action }}
          POLICY_KIND: ${{ inputs.kind }}
          POLICY_IDENTIFIER: ${{ inputs.identifier }}
        run: >-
          python admin/update_policy.py
          --action "$POLICY_ACTION"
          --kind "$POLICY_KIND"
          --identifier "$POLICY_IDENTIFIER"

      - name: Sign policy
        env:
          PANT_POLICY_PRIVATE_KEY: ${{ secrets.PANT_POLICY_PRIVATE_KEY }}
        run: python admin/sign_policy.py

      - name: Commit signed policy
        env:
          POLICY_ACTION: ${{ inputs.action }}
        run: |
          git diff --check
          git config user.name "pant-access-bot"
          git config user.email "pant-access-bot@users.noreply.github.com"
          git add -- access/policy.json revoked.txt access/revoked.txt
          if git diff --cached --quiet; then
            echo "No policy change to commit"
            exit 0
          fi
          git commit -m "access: ${POLICY_ACTION}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
